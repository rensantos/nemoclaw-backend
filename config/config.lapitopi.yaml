# Template for a PER-MACHINE config file.
#
# Copy to config/config.<name>.yaml where <name> is this machine's
# hostname (found automatically) or the value of INSTANCE, then commit it.
#
#   cp config/config.example.machine.yaml config/config.$(hostname).yaml
#
# These files are TRACKED on purpose: every machine's real configuration
# is then versioned and readable from any other machine. They cannot
# conflict with each other because each machine only ever edits its own -
# that is why the filename carries the machine name rather than all of
# them sharing one path.
#
# Layering, lowest priority first:
#   1. config/config.yaml              tracked, shared defaults
#   2. config/config.<instance>.yaml   tracked, THIS machine  <- this file
#   3. config/config.local.yaml        untracked, never committed
#   4. environment variables           highest
#
# Set only what differs here; everything else falls through to the shared
# file. A section you omit entirely is left completely untouched.
#
# KNOWN GAP: reads are layered, writes are not. A persisted `model switch`
# or a model auto-registered after a pull still lands in the shared
# config.yaml, not here.

backend:
  # Friendly name reported by GET /health; defaults to the hostname.
  instance: laptopi
  # 8000 is often the SSH tunnel to a remote node - a local backend needs
  # its own port.
  port: 8001
  # Whichever card is actually free on this box. NOT a reservation:
  # check `./backend gpu` rather than copying another machine's value.
  gpu: "0"
  engine: ollama
  ollama_host: http://127.0.0.1:11434

model:
  # Two independent reasons a model reads servable_context_length 0 on
  # this machine, and only ONE of them is about memory. Both were live
  # here on 2026-08-20 and they were initially confused for each other.
  #
  # 1. THE FORMULA CANNOT COMPUTE IT. servable_context_length() needs
  #    attention.key_length from Ollama /api/show, and returns 0 - meaning
  #    "could not tell", not "no context" - when it is absent. Ollama does
  #    not report it for llama- or qwen2-architecture models:
  #
  #      deepseek-r1:14b  arch qwen2  key_length ABSENT -> always 0
  #      hermes3:8b       arch llama  key_length ABSENT -> always 0
  #      qwen3:4b         arch qwen3  key_length 128    -> computable
  #      qwen3:1.7b       arch qwen3  key_length 128    -> computable
  #
  #    No amount of free memory changes the first two. Do not pick a
  #    llama/qwen2 model here expecting a window to appear once the
  #    browsers are closed - it will not.
  #
  #    Do NOT "fix" this by deriving head_dim as embedding_length /
  #    head_count: qwen3:4b reports key_length 128 while that derivation
  #    gives 80, so a naive fallback would under-count the KV cache by 1.6x
  #    and promise a context this machine cannot hold.
  #
  # 2. IT GENUINELY DOES NOT FIT. usable = available - weights - 3 GiB,
  #    servable = usable / (blocks * kv_heads * (k+v) * 2). This box has
  #    15 GiB with ~10 GiB held by browsers and editors, so ~5.1-5.8 GiB
  #    is available and it MOVES:
  #
  #      qwen3:4b    2.33 GiB, 147,456 B/token, needs >5.33 GiB available
  #                  -> 3,142 tokens at 5.78 GiB, 0 at 5.11 GiB. Marginal.
  #      qwen3:1.7b  1.27 GiB, 114,688 B/token, needs >4.27 GiB available
  #                  -> 7,859 tokens at 5.11 GiB. Always serves something.
  #
  # qwen3:4b is the operator's choice: this node is not used for /deepweb
  # (which starts its context ladder at 4,096 and runs on ubi from this
  # machine), so a few thousand tokens for chat is enough, and its window
  # grows straight away when memory frees. Switch to qwen3:1.7b if a
  # guaranteed non-zero window matters more than model quality.
  id: qwen3:4b
  # Replaces the shared catalog wholesale when present (lists are not
  # merged element-wise). List what this machine has actually pulled.
  available:
    - id: deepseek-r1:14b
      path: deepseek-r1:14b
      engine: ollama
    - id: hermes3:8b
      path: hermes3:8b
      engine: ollama
    - id: qwen3:4b
      path: qwen3:4b
      engine: ollama
    - id: qwen3:1.7b
      path: qwen3:1.7b
      engine: ollama