# Per-machine config for this desktop ("Ze Rob"), layered over
# config/config.yaml. Tracked on purpose: every machine's real
# configuration is then versioned and readable from any other machine.
# Only this machine edits this file, so it cannot conflict with UBI's or
# the laptop's - that is why the filename carries the machine name.
#
# Found automatically by hostname (ESP-SROB-PCPROF), so it applies however
# the backend is invoked - with or without INSTANCE set.

backend:
  # Friendlier name than the hostname; reported by GET /health.
  instance: zerob
  # 8000 is the SSH tunnel to UBI's backend on this machine, so the local
  # one has to live elsewhere.
  port: 8001
  # Single RTX 3060 here, not UBI's 4x A4000.
  gpu: "0"
  engine: ollama
  ollama_host: http://127.0.0.1:11434

model:
  id: qwen3:30b-a3b
  # No `available:` list on purpose. ModelManager derives the selectable
  # catalog from the Ollama daemon itself, so whatever is pulled here is
  # selectable and nothing needs registering by hand. A hand-maintained
  # list was briefly synced here (16 tags) and then removed once
  # discovery landed - keeping one would only reintroduce the drift it
  # replaced, and a per-machine `available:` REPLACES the shared catalog
  # wholesale during layering, which is what made a pulled-but-unlisted
  # gemma4:12b unselectable in the first place.
  #
  # Add an `available:` entry here only to pin extra metadata for a
  # specific model, never as the source of truth for which exist.
