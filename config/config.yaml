backend:
  host: 127.0.0.1
  port: 8000
  # NOT a reservation. No GPU on the shared box is assigned to anyone -
  # allocation is opportunistic, whoever needs a free card takes one, so
  # which indices are free changes over time and this value is only a
  # snapshot of what was idle when it was last set. Check what is
  # actually free (`./backend gpu`) and set this per machine in
  # config.local.yaml rather than assuming these indices are yours. A
  # comma-separated list lets device_map="auto" (fp16 only - see
  # model.quantization below) shard a model that doesn't fit a single
  # 16GB card across both. Known caveat: GPUManager
  # (services/gpu.py) matches this value against a single nvidia-smi GPU
  # index, so a multi-GPU value here makes ./backend status/gpu current
  # report VRAM/temperature as unavailable - cosmetic only, does not
  # affect actual model serving (docs/future-tasks.md's Multi-GPU entry).
  gpu: "2,3"
  # Which InferenceEngine implementation serves requests.
  # Valid values: transformers | ollama (see docs/ollama-engine-design.md)
  # ollama: as of 2026-07-31, the Ollama daemon runs on UBI itself (not a
  # remote Local Node) - see docs/ollama-on-ubi-design.md for why this
  # became possible (transformers/torch's driver ceiling doesn't apply to
  # Ollama's llama.cpp/GGML runtime) and how it's deployed (no root,
  # ollama v0.9.2, cron @reboot). ollama_host below stays default since
  # the daemon is local to this same machine.
  engine: ollama
  ollama_host: http://127.0.0.1:11434

model:
  # qwen3:30b (MoE, qwen3moe architecture) via the Ollama daemon on UBI
  # (2026-08-01), replacing llama3.2-vision:11b. Native context is
  # 262,144 - confirmed via `ollama show qwen3:30b` directly on UBI, not
  # just Ollama's library page. Far larger than dense qwen3 (32b/8b/1.7b,
  # 40,960 - do not conflate). Chosen as an interim default: UBI's disk
  # is critically low (~7.6GB free after this pull, single-model-only
  # policy in effect until that improves) and its old driver/glibc block
  # both gemma4 and qwen3.5 (412: requires a newer Ollama version) - see
  # docs/problems.md. Superseded until a planned OS upgrade (Ubuntu
  # 24.04 + driver reinstall, not yet scheduled) removes that ceiling.
  id: qwen3:30b
  # -1 is Ollama's own "no limit" convention (num_predict), passed
  # straight through. Unlimited by default so a reasoning model is never
  # cut off mid-thought: at the previous 256, qwen3:30b routinely spent
  # its whole budget on hidden <think> before reaching an answer, and the
  # engine then (correctly, per its never-mislabel rule) flushed that
  # unfinished reasoning as the answer - which read as raw "Okay, the
  # user is asking..." text in chat. A caller that wants to spend fewer
  # tokens still sets max_tokens per request; this is only the default
  # when they say nothing.
  max_tokens_default: -1
  temperature_default: 0.7
  # OllamaEngine-only (see engines/ollama_engine.py's _apply_think()).
  # qwen3:30b has a real `thinking` capability (confirmed via `ollama
  # show`) - this is NOT a no-op like it was for llama3.2-vision. Kept
  # at false, the same deliberate choice made for qwen3:32b: default
  # chat responses skip the <think> reasoning trace so max_tokens isn't
  # consumed before reaching an answer. A per-request "think": true
  # override still works - see docs/ollama-engine-design.md.
  think_default: false
  # TransformersEngine loading precision. Valid values: none | 4bit | 8bit
  # (see docs/quantization-design.md). Requires bitsandbytes installed.
  # On UBI: transformers is pinned to 4.36.0 (see docs/problems.md) -
  # only architectures that version already supported will load, and even
  # then, Hub tokenizer.json file-format drift can still break loading
  # independent of architecture age (see docs/problems.md's Mistral note).
  # bitsandbytes is currently broken on UBI regardless of value chosen
  # here (torch.library.impl_abstract missing under pinned torch 2.0.1) -
  # kept at "none" until that's fixed.
  quantization: none
  # revision/quantization/available's transformers entries below are for
  # TransformersEngine specifically and only take effect if backend.engine
  # is switched back to transformers - inactive while engine: ollama.
  # NousResearch/Meta-Llama-3-8B-Instruct loads cleanly at `main` under
  # the pinned transformers==4.36.0 (confirmed 2026-07-31); no revision
  # pin needed. Llama-3's much larger vocabulary (128k vs Llama-2/
  # Mistral's 32k) makes its fp16 footprint exceed one 16GB card with no
  # headroom to spare - hence backend.gpu above spans two GPUs.
  revision: ""
  available:
    - id: qwen3:30b
      name: Qwen3 30B-A3B MoE (Ollama, live default - 262,144 context, ~18GB disk, currently pulled)
      path: qwen3:30b
      engine: ollama
      device: cuda
    - id: llama3.2-vision:11b
      name: Llama 3.2 Vision 11B (Ollama, validated - 131K context, single GPU, ~12.1GB - not currently pulled)
      path: llama3.2-vision:11b
      engine: ollama
      device: cuda
    - id: llama3.2:3b
      name: Llama 3.2 3B (Ollama, validated, 131K context, lighter fallback - not currently pulled)
      path: llama3.2:3b
      engine: ollama
      device: cuda
    - id: gemma3:4b
      name: Gemma 3 4B (Ollama, validated, 131K context - not currently pulled)
      path: gemma3:4b
      engine: ollama
      device: cuda
    - id: qwen3:32b
      name: Qwen3 32B (Ollama, validated - 40,960 context only, needs both GPUs, ~20GB disk, not currently pulled)
      path: qwen3:32b
      engine: ollama
      device: cuda
    - id: qwen3:8b
      name: Qwen3 8B (Ollama, validated - 40,960 context only, fits one GPU - not currently pulled)
      path: qwen3:8b
      engine: ollama
      device: cuda
    - id: qwen3:1.7b
      name: Qwen3 1.7B (Ollama, lighter validated fallback - 40,960 context only, not currently pulled)
      path: qwen3:1.7b
      engine: ollama
      device: cuda
    - id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
      name: TinyLlama 1.1B Chat
      path: TinyLlama/TinyLlama-1.1B-Chat-v1.0
      engine: transformers
      device: cuda
    - id: mistralai/Mistral-7B-Instruct-v0.2
      name: Mistral 7B Instruct v0.2 (needs model.revision dca6e4b6, see docs/problems.md)
      path: mistralai/Mistral-7B-Instruct-v0.2
      engine: transformers
      device: cuda
    - id: NousResearch/Meta-Llama-3-8B-Instruct
      name: Llama 3 8B Instruct (needs 2 GPUs, see backend.gpu)
      path: NousResearch/Meta-Llama-3-8B-Instruct
      engine: transformers
      device: cuda
