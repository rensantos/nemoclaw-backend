openapi: 3.1.0
info:
  title: Nemoclaw Backend Node API
  version: "1.0.0"
  description: |
    Authoritative API contract for one Nemoclaw Backend instance (a "backend
    node"). This is the single source of truth for what a backend node
    exposes today and what is committed for future increments.

    Two tiers:

    - **Tier 1 — OpenAI-compatible surface** (`/v1/*`): interoperability with
      any OpenAI-compatible client. Stable once implemented; no breaking
      changes without explicit architectural approval (see AGENTS.md).
    - **Tier 2 — Native management surface**: Nemoclaw-specific power
      (health, lifecycle, admin, discovery, observability). Stability varies
      by endpoint; see each endpoint's `x-implementation-status` and
      description.

    Every path in this document carries an `x-implementation-status` of one
    of: `implemented`, `partial`, `stub`, `planned`, `unscheduled`. See
    docs/api-contract.md for the legend and the architectural rules this
    contract enforces.
  x-decision-records:
    - "The /admin/model/* namespace is the adopted control-plane contract; it
       supersedes the Nemoclaw system spec's flat /models/load,
       /models/unload, /engines/switch paths (spec §6.5). See commit
       61526a9 and docs/architecture.md."
    - "GET /lifecycle (planned) is read-only observability/status only. It
       performs no transitions. /admin/model/* remains the authoritative
       lifecycle CONTROL surface."

servers:
  - url: http://127.0.0.1:8000
    description: Single backend instance (default local deployment; host/port
      are configurable per docs/architecture.md Model Configuration).

tags:
  - name: openai-compatible
    description: Tier 1 — OpenAI-compatible surface. Stable contract.
  - name: native-management
    description: Tier 2 — Native Nemoclaw management surface.

paths:
  # ---------------------------------------------------------------------
  # Tier 1 — OpenAI-compatible surface
  # ---------------------------------------------------------------------
  /v1/chat/completions:
    post:
      tags: [openai-compatible]
      summary: Create a chat completion
      operationId: createChatCompletion
      x-implementation-status: partial
      x-current-behavior: |
        Non-streaming chat completion is implemented end to end against the
        configured engine.

        "stream" is accepted by the request schema but is NOT implemented:
        if "stream": true, the handler immediately raises HTTP 400 with
        {"detail": "Streaming is not supported"} before any inference runs.
        The target contract (once the streaming phase lands) is
        Server-Sent Events per OpenAI convention when "stream": true.

        Model-resolution behavior now differs by active engine
        (docs/ollama-engine-design.md Section 1):

        - TransformersEngine (unchanged, out of scope for that decision):
          the response "model" field echoes the request's "model" (or the
          configured default if omitted) as a label. It does NOT select
          which model actually serves the request — there is exactly one
          loaded model per backend instance, chosen at process startup. A
          client requesting a "model" other than the loaded one still gets
          served by the loaded model, labeled with the requested id.
        - OllamaEngine: a request naming a "model" other than this
          instance's configured/servable model is rejected with HTTP 404
          (see the "404" response below) — never silently served by a
          different model. If "model" is omitted or matches the servable
          model, the response "model" field is the actual served model.
        - Either engine: if the engine's backing runtime is unreachable
          (currently only possible for OllamaEngine, when the Ollama
          daemon is down), the request fails with HTTP 503 (see the "503"
          response below) rather than hanging or raising an unhandled 500.
      description: |
        Implemented for non-streaming requests. Streaming ("stream": true)
        is contractually defined as SSE per OpenAI convention but returns
        HTTP 400 today; see x-current-behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion (non-streaming only, today).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          description: |
            Either "stream": true (not supported yet) or an empty
            "messages" array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"
        "404":
          description: |
            "model" names a model this backend instance cannot serve.
            OllamaEngine only, per docs/ollama-engine-design.md Section 1;
            TransformersEngine never returns this today (see
            x-current-behavior).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelNotFoundResponse"
        "422":
          description: Request body failed schema validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "503":
          description: |
            The engine's backing runtime is unreachable (e.g. the Ollama
            daemon is down), OR the backend is mid-lifecycle-transition
            (lifecycle_state is not "ready"). Transition-time requests are
            rejected, never queued — see /admin/model/*.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /v1/models:
    get:
      tags: [openai-compatible]
      summary: List available models
      operationId: listModels
      x-implementation-status: implemented
      description: |
        The authoritative model-listing endpoint. There is NO separate
        native /models endpoint — do not add one; Core and adapters must
        use this endpoint for model discovery.

        Returns every model a caller may select: config/config.yaml's
        model.available catalog, filtered to entries belonging to the
        active backend.engine, joined with what the engine knows about
        each at runtime. This is what a frontend model picker should be
        built on — it can grey out entries that are not "pulled" or do not
        "fit" instead of offering choices that fail on selection.

        The catalog is the gate: only listed models may be loaded or
        switched to (POST /admin/model/*). "loaded" marks which one is
        currently serving, so the listing tracks runtime state.

        Behavior change (2026-08-03, approved): this endpoint previously
        returned exactly one entry, the loaded model. It now enumerates
        the selectable catalog, matching OpenAI's own /v1/models
        semantics. The per-entry OpenAI fields (id, object, created,
        owned_by) are unchanged, so OpenAI-compatible clients still parse
        it; "loaded", "pulled", "size_mib" and "fits" are additive
        Nemoclaw extensions.
      responses:
        "200":
          description: OpenAI-compatible list of selectable models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "503":
          description: >-
            The engine's backing runtime is unreachable, so which models
            are usable cannot be determined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

  /v1/completions:
    post:
      tags: [openai-compatible]
      summary: Create a legacy-style text completion
      operationId: createCompletion
      x-implementation-status: planned
      description: |
        Planned. Target contract: OpenAI-compatible text completion
        (prompt in, choices with generated text out). Not implemented;
        calling this endpoint today returns 404 (no route registered).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: Text completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"

  /v1/embeddings:
    post:
      tags: [openai-compatible]
      summary: Create embeddings
      operationId: createEmbeddings
      x-implementation-status: unscheduled
      description: |
        Planned but unscheduled. No engine (InferenceEngine) currently
        defines an embed() method and none is on the near-term roadmap
        (see docs/architecture.md Engine Interface section). Calling this
        endpoint today returns 404 (no route registered).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: Embedding vectors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"

  # ---------------------------------------------------------------------
  # Tier 2 — Native management surface
  # ---------------------------------------------------------------------
  /health:
    get:
      tags: [native-management]
      summary: Backend health and runtime status
      operationId: getHealth
      x-implementation-status: partial
      x-current-behavior: |
        Today's only implementation (TransformersEngine, always-ready
        lifecycle) ever returns "status": "ok" — there is no code path
        that produces "degraded" or "unavailable" yet. The
        ok/degraded/unavailable enum on HealthResponse.status is the
        target contract; real "degraded"/"unavailable" reporting arrives
        with OllamaEngine health handling (see
        docs/ollama-engine-design.md). This widens the pinned contract to
        resolve the gap reported in commit 1078a46: "status" was
        previously pinned as const "ok" with no way to report a
        daemon-down or not-yet-servable runtime.
      description: |
        Returns engine health merged with the backend's lifecycle state.
        "status" is a pure projection of "lifecycle_state" (see
        HealthResponse), not an independent truth source. "gpu" is a
        single GPU name string (or null), not the richer multi-GPU detail
        GPUManager can produce — see the planned /gpu endpoint for that.
      responses:
        "200":
          description: Health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /lifecycle:
    get:
      tags: [native-management]
      summary: Read-only lifecycle status
      operationId: getLifecycle
      x-implementation-status: planned
      description: |
        OBSERVABILITY/STATUS ONLY. Returns the current LifecycleState and
        related read-only metadata. It performs no transitions.

        Decision record: /admin/model/* remains the authoritative
        lifecycle CONTROL surface (see commit 61526a9); /lifecycle is
        read-only and must never gain load/unload/switch side effects.
        Not implemented today; calling this endpoint returns 404.
      responses:
        "200":
          description: Current lifecycle status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleStatusResponse"

  /admin/model/load:
    post:
      tags: [native-management]
      summary: Load a model
      operationId: adminModelLoad
      x-implementation-status: implemented
      description: |
        The /admin/* namespace carries NO stability guarantee.

        Loads model_id when nothing is currently loaded. The target is
        validated twice before any runtime change: first against
        config.yaml's model.available catalog (ModelManager), then by the
        engine against its own reality (for OllamaEngine, that the tag is
        already pulled — it never pulls).

        State rules (docs/model-lifecycle-design.md, Concurrency Model):
        - lifecycle_state "ready" and model_id is the loaded model:
          idempotent success, no engine call.
        - lifecycle_state "ready" and model_id differs: 409, directing the
          caller to /admin/model/switch.
        - lifecycle_state "unloaded" or "degraded": transitions through
          "loading" to "ready", draining any in-flight requests first.

        Only engines advertising runtime lifecycle support accept this.
        TransformersEngine returns 501: its CUDA state is owned in-process
        where cleanup is best-effort, so a supervised worker is required
        (deferred). A missing or malformed body fails FastAPI request
        validation first and returns the standard 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelLifecycleRequest"
      responses:
        "200":
          description: Model loaded (or already loaded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleResultResponse"
        "404":
          description: model_id is not in config.yaml's model.available catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "409":
          description: >-
            Either illegal from the current lifecycle_state (typically
            loading a different model while one is already ready), or the
            engine rejected the target in its pre-flight check
            ("model_unavailable" — e.g. the Ollama tag is configured but
            not pulled). Pre-flight rejections change nothing: the
            previously loaded model keeps serving and lifecycle_state is
            unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "501":
          description: The active engine does not support runtime lifecycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "503":
          description: >-
            The engine runtime was unreachable, or the load failed after
            the pre-flight check had already passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "422":
          description: Missing or malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /admin/model/unload:
    post:
      tags: [native-management]
      summary: Unload the current model
      operationId: adminModelUnload
      x-implementation-status: implemented
      description: |
        The /admin/* namespace carries NO stability guarantee.

        Takes no request body. Drains in-flight requests, then transitions
        through "unloading" to "unloaded". Idempotent when already
        unloaded (no engine call). From "degraded" it transitions straight
        to "unloaded" with a best-effort engine call, since the state
        table has no degraded -> unloading edge.

        For OllamaEngine this asks the daemon to evict the model
        (keep_alive: 0). It is best-effort: the backend neither stops nor
        supervises the daemon process, and eviction is not guaranteed to
        be synchronous.

        While unloaded, POST /v1/chat/completions and POST /generate
        return 503.
      responses:
        "200":
          description: Model unloaded (or already unloaded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleResultResponse"
        "501":
          description: The active engine does not support runtime lifecycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "503":
          description: The engine runtime was unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"

  /admin/model/switch:
    post:
      tags: [native-management]
      summary: Switch to a different model
      operationId: adminModelSwitch
      x-implementation-status: implemented
      description: |
        The /admin/* namespace carries NO stability guarantee.

        Single transition from one ready model to another. Requires
        lifecycle_state "ready"; from any other state this returns 409
        directing the caller to /admin/model/load. The target is validated
        against config.yaml's model.available catalog before any runtime
        change.

        Requests arriving during "switching" are rejected with 503, never
        queued (docs/model-lifecycle-design.md: queuing hides latency
        spikes and can answer from either model).

        OllamaEngine verifies the target tag is present on the daemon
        BEFORE releasing the current model, so a bad target leaves the old
        model serving and the state stays "ready" — the design doc's
        rollback goal, cheap for a daemon-owned runtime. A failure after
        that point leaves lifecycle_state "degraded".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelLifecycleRequest"
      responses:
        "200":
          description: Switched; loaded_model is now the requested model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleResultResponse"
        "404":
          description: model_id is not in config.yaml's model.available catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "409":
          description: >-
            Either lifecycle_state was not "ready" (no model to switch
            from), or the engine rejected the target in its pre-flight
            check ("model_unavailable" — e.g. the Ollama tag is configured
            but not pulled). Pre-flight rejections change nothing: the
            previous model keeps serving and lifecycle_state stays
            "ready".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "501":
          description: The active engine does not support runtime lifecycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "503":
          description: >-
            The engine runtime was unreachable, or the switch failed
            after the pre-flight check had already passed, leaving
            lifecycle_state "degraded".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleErrorResponse"
        "422":
          description: Missing or malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /capabilities:
    get:
      tags: [native-management]
      summary: Engine capability discovery
      operationId: getCapabilities
      x-implementation-status: planned
      description: |
        Planned discovery endpoint so Core and adapters can code against a
        stable shape ahead of implementation. Mirrors the growth policy in
        docs/architecture.md's Engine Interface section: reports which
        InferenceEngine methods the loaded engine currently supports.
        Not implemented today; calling this endpoint returns 404.
      responses:
        "200":
          description: Engine capability summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /engines:
    get:
      tags: [native-management]
      summary: List configured/available engines
      operationId: listEngines
      x-implementation-status: planned
      description: |
        Planned. Target contract: enumerate the engine(s) this backend
        instance can run (today, exactly one: TransformersEngine), each
        with an id, type, and status. Not implemented today; calling this
        endpoint returns 404.
      responses:
        "200":
          description: Engine list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnginesResponse"

  /metrics:
    get:
      tags: [native-management]
      summary: Observability metrics
      operationId: getMetrics
      x-implementation-status: planned
      description: |
        Planned. No metrics collection exists yet (Phase 4 explicitly does
        not implement Prometheus/Grafana per docs/architecture.md). This
        schema defines the minimal shape for future MonitorService output.
        Not implemented today; calling this endpoint returns 404.
      responses:
        "200":
          description: Point-in-time metrics snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"

  /gpu:
    get:
      tags: [native-management]
      summary: Current GPU status
      operationId: getGpu
      x-implementation-status: planned
      description: |
        Planned HTTP surface for the GPU status already computed by
        services/gpu.py's GPUManager.current() for the CLI
        (`backend gpu current`). Schema mirrors CurrentGPUInfo exactly so
        no fields are invented ahead of implementation. Not implemented
        today; calling this endpoint returns 404.
      responses:
        "200":
          description: Current GPU status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpuStatusResponse"

  /benchmarks:
    get:
      tags: [native-management]
      summary: Available benchmark types and their status
      operationId: listBenchmarks
      x-implementation-status: planned
      description: |
        Planned. Reflects the benchmark types services/benchmark.py's
        BenchmarkService already implements for the CLI (latency,
        throughput, vram, first-token-latency), reporting availability —
        first-token-latency is unavailable until streaming exists. This
        endpoint does not execute benchmarks or store results; it only
        reports what is available. Not implemented today; calling this
        endpoint returns 404.
      responses:
        "200":
          description: Benchmark availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenchmarksResponse"

  /generate:
    post:
      tags: [native-management]
      summary: Legacy text generation (compatibility endpoint)
      operationId: generateLegacy
      x-implementation-status: implemented
      deprecated: true
      description: |
        Implemented legacy compatibility endpoint predating the
        OpenAI-compatible surface. Deprecated: prefer
        POST /v1/chat/completions. Kept only for old local callers per
        docs/architecture.md's Compatibility section.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generated text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "503":
          description: |
            The engine's backing runtime is unreachable (e.g. the Ollama
            daemon is down), OR the backend is mid-lifecycle-transition
            (lifecycle_state is not "ready"). Transition-time requests are
            rejected, never queued — see /admin/model/*.

            GenerateRequest has no "model" field, so the model-resolution
            404 (see POST /v1/chat/completions) does not apply here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorResponse"

components:
  schemas:
    # --- Tier 1 schemas -------------------------------------------------
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
        content:
          type: string

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: [string, "null"]
          description: >-
            Optional. Behavior differs by active engine — see
            x-current-behavior on POST /v1/chat/completions.
            TransformersEngine: echoed back as a label, does not select
            which model serves the request. OllamaEngine: must be omitted
            or equal to this instance's servable model, or the request is
            rejected with HTTP 404 (model_not_found).
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          description: >-
            Must contain at least one message. An empty array is accepted
            by the JSON schema but rejected at runtime with HTTP 400
            ("messages must not be empty").
        max_tokens:
          type: [integer, "null"]
        temperature:
          type: [number, "null"]
        stream:
          type: boolean
          default: false
          description: >-
            Contract: SSE per OpenAI convention when true. Current
            behavior: HTTP 400 when true (see x-current-behavior on the
            operation).
        think:
          type: [boolean, "null"]
          description: >-
            Not part of the OpenAI Chat Completions API - a Nemoclaw
            extension. OllamaEngine-only: forwarded as Ollama's top-level
            `think` request field, controlling whether a reasoning-capable
            model (e.g. Qwen3) emits a <think> trace before its answer.
            null/omitted falls back to the configured model.think_default;
            if that is also null, Ollama's own per-model default applies.
            TransformersEngine ignores this field entirely - no equivalent
            concept there.

    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          type: string
          example: "chatcmpl-3f9a1b2c4d5e6f7a8b9c0d1e2f3a4b5c"
        object:
          type: string
          const: chat.completion
        created:
          type: integer
          description: Unix epoch seconds.
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
                const: 0
              message:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
                    description: >-
                      The assistant's answer only. For reasoning models any
                      hidden thinking is separated out into "reasoning"
                      below, so an OpenAI-compatible client that renders
                      just this field never shows internal monologue or a
                      stray "</think>" marker.
                  reasoning:
                    type: string
                    description: >-
                      Nemoclaw extension. A reasoning model's hidden
                      thinking, taken from Ollama's "message.thinking" when
                      it supplies one, or split off the raw content at the
                      "</think>" marker when the model's chat template
                      leaks it inline (qwen3:30b MoE does this, and also
                      ignores "think": false entirely). Omitted when the
                      model did no reasoning, which is always the case for
                      non-reasoning models and for TransformersEngine.
              finish_reason:
                type: string
                const: stop
                description: >-
                  Always "stop" today; no other finish reasons are
                  produced (no length/content-filter distinction yet).
        usage:
          $ref: "#/components/schemas/Usage"

    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    ModelListResponse:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelObject"

    ModelObject:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        created:
          type: integer
        owned_by:
          type: string
          description: >-
            Engine that owns this model, per docs/ollama-engine-design.md
            Section 2: "local" for TransformersEngine, "ollama" for
            OllamaEngine. Not a namespacing scheme — single-active-engine
            per backend instance means at most one value is ever present.
          example: local
        loaded:
          type: boolean
          description: >-
            Nemoclaw extension. Whether this is the model currently
            serving requests. At most one entry is true; none are when the
            lifecycle state is "unloaded".
        pulled:
          type: boolean
          description: >-
            Nemoclaw extension. Whether the model is actually downloaded
            and usable right now. A catalogued model that is not pulled
            can be listed but cannot be switched to — the engine rejects
            it (409 model_unavailable) until it is downloaded. Absent when
            the engine cannot determine it.
        size_mib:
          type: integer
          description: >-
            Nemoclaw extension. Estimated VRAM needed to serve this model
            fully on GPU, derived from its on-disk size. Absent when
            unknown (e.g. the model is not pulled).
        fits:
          type: boolean
          description: >-
            Nemoclaw extension. Whether size_mib fits the VRAM the engine
            runtime can currently reach. False means selecting it may run
            partly on CPU or fail; ./backend gpu pin-free can re-select
            GPUs. Absent when either side is unknown.

    CompletionRequest:
      type: object
      required: [prompt]
      properties:
        model:
          type: [string, "null"]
        prompt:
          type: string
        max_tokens:
          type: [integer, "null"]
        temperature:
          type: [number, "null"]

    CompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          const: text_completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              text:
                type: string
              finish_reason:
                type: string

    EmbeddingRequest:
      type: object
      required: [input]
      properties:
        model:
          type: [string, "null"]
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    EmbeddingResponse:
      type: object
      required: [object, data, model]
      properties:
        object:
          type: string
          const: list
        model:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                const: embedding
              index:
                type: integer
              embedding:
                type: array
                items:
                  type: number

    # --- Tier 2 schemas ---------------------------------------------------
    LifecycleState:
      type: string
      enum: [unloaded, loading, ready, unloading, switching, degraded]
      description: See services/lifecycle.py and docs/model-lifecycle-design.md.

    HealthResponse:
      type: object
      required: [status, model, cuda, gpu, lifecycle_state]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
          description: |
            Pure projection of lifecycle_state — not an independent truth
            source. Exact mapping (see services/lifecycle.py for
            LifecycleState, the source of truth for state names):
            - lifecycle_state "ready" -> "ok": engine runtime healthy,
              requests servable.
            - lifecycle_state "degraded" -> "degraded": backend process
              alive but engine runtime impaired (e.g. Ollama daemon
              unreachable, unrecoverable engine error); inference requests
              are expected to fail.
            - lifecycle_state "unloaded", "loading", "unloading",
              "switching" -> "unavailable": backend responds but no
              engine is currently servable (e.g. model unloaded or
              mid-transition).
        model:
          type: string
        cuda:
          type: boolean
        gpu:
          type: [string, "null"]
          description: Single GPU device name, or null if CUDA is unavailable.
        lifecycle_state:
          $ref: "#/components/schemas/LifecycleState"
        loaded_model:
          type: [string, "null"]
          description: >-
            Model id actually loaded in this running process. Can differ
            from the "model" field's configured default after a
            non-persisted POST /admin/model/switch; null while unloaded.
        target_model:
          type: [string, "null"]
          description: >-
            Model id being transitioned to while lifecycle_state is
            "loading" or "switching"; null otherwise.

    LifecycleStatusResponse:
      type: object
      required: [lifecycle_state]
      properties:
        lifecycle_state:
          $ref: "#/components/schemas/LifecycleState"
        model:
          type: [string, "null"]
          description: Currently loaded model id, if any.

    ModelLifecycleRequest:
      type: object
      required: [model_id]
      properties:
        model_id:
          type: string
        persist:
          type: boolean
          default: false
          description: >-
            When true, a successful transition also rewrites model.id in
            config/config.yaml (via ModelManager.select_model) so a restart
            keeps the new model. Default false is runtime-only: the change
            is lost on restart. Nemoclaw extension, not part of any
            OpenAI spec.

    LifecycleResultResponse:
      type: object
      required:
        [status, lifecycle_state, loaded_model, previous_model,
         elapsed_seconds, persisted]
      properties:
        status:
          type: string
          const: ok
        lifecycle_state:
          $ref: "#/components/schemas/LifecycleState"
        loaded_model:
          type: [string, "null"]
          description: Model id loaded after the transition; null after unload.
        previous_model:
          type: [string, "null"]
          description: Model id loaded before the transition, if any.
        elapsed_seconds:
          type: number
          description: >-
            Wall-clock duration of the transition, including any wait for
            in-flight requests to drain.
        persisted:
          type: boolean
          description: Whether config.yaml was rewritten (see request "persist").
        warning:
          type: string
          description: >-
            Present only when the transition succeeded but something is
            worth flagging - currently that the model looks larger than
            the VRAM the engine runtime can reach, so it may run partly on
            CPU. Advisory: the requirement is estimated from the model's
            on-disk size, so this never fails the operation. Absent when
            there is nothing to report.

    LifecycleErrorResponse:
      type: object
      required: [error, detail, lifecycle_state]
      properties:
        error:
          type: string
          enum:
            - model_not_configured
            - model_unavailable
            - lifecycle_conflict
            - lifecycle_not_supported
            - engine_unavailable
            - lifecycle_failed
        detail:
          type: string
        lifecycle_state:
          $ref: "#/components/schemas/LifecycleState"
          description: State at the time the error was returned.

    CapabilitiesResponse:
      type: object
      required: [engine, features]
      properties:
        engine:
          type: string
          example: transformers
        features:
          type: object
          description: >-
            Reflects InferenceEngine methods; grows per
            docs/architecture.md's Engine Interface growth policy.
          properties:
            chat:
              type: boolean
            generate_text:
              type: boolean
            stream:
              type: boolean
            embed:
              type: boolean
            benchmark:
              type: boolean

    EnginesResponse:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required: [id, type, status]
            properties:
              id:
                type: string
              type:
                type: string
                example: transformers
              status:
                $ref: "#/components/schemas/LifecycleState"

    MetricsResponse:
      type: object
      description: Minimal shape; no metrics collection exists yet.
      properties:
        requests_total:
          type: integer
        tokens_total:
          type: integer
        uptime_seconds:
          type: number

    GpuStatusResponse:
      type: object
      description: Mirrors services/gpu.py CurrentGPUInfo exactly.
      required:
        - selected_cuda_device
        - backend_gpu
        - current_model
        - cuda_available
        - torch_current_device
        - driver_version
      properties:
        selected_cuda_device:
          type: string
        backend_gpu:
          type: string
        current_model:
          type: string
        available_memory_mib:
          type: [integer, "null"]
        cuda_available:
          type: boolean
        torch_current_device:
          type: string
        driver_version:
          type: string

    BenchmarksResponse:
      type: object
      required: [benchmarks]
      properties:
        benchmarks:
          type: array
          items:
            type: object
            required: [name, available]
            properties:
              name:
                type: string
                enum: [latency, throughput, vram, first-token-latency]
              available:
                type: boolean
              message:
                type: string
                description: >-
                  Set for unavailable benchmarks, e.g. first-token-latency
                  before streaming exists.

    GenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        max_new_tokens:
          type: integer
          description: Defaults to the configured model.max_tokens_default.
        temperature:
          type: number
          description: Defaults to the configured model.temperature_default.
        think:
          type: [boolean, "null"]
          description: >-
            Same Nemoclaw extension as ChatCompletionRequest.think - see
            that schema's description. OllamaEngine-only.

    GenerateResponse:
      type: object
      required: [model, response]
      properties:
        model:
          type: string
        response:
          type: string
          description: >-
            Full decoded output including the prompt (not prompt-stripped,
            unlike /v1/chat/completions). Any reasoning is separated into
            "reasoning" below, same rule as chat completions.
        reasoning:
          type: [string, "null"]
          description: >-
            Nemoclaw extension. A reasoning model's hidden thinking, or
            null when there was none.

    # --- Shared error schemas -------------------------------------------
    SimpleErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
      description: FastAPI's default HTTPException body shape.

    ModelNotFoundResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, param, code]
          properties:
            message:
              type: string
              example: >-
                The model 'llama2:7b' does not exist or is not currently
                loaded by this backend instance.
            type:
              type: string
              const: invalid_request_error
            param:
              type: string
              const: model
            code:
              type: string
              const: model_not_found
      description: >-
        OpenAI-style model_not_found error shape, per
        docs/ollama-engine-design.md Section 1. Deliberately not
        SimpleErrorResponse's {"detail": "..."} shape — matches OpenAI's own
        convention for this error instead.

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
      description: FastAPI's standard 422 validation error body shape.
